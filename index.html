/* ---------- празднование ---------- */
function celebrate(){try{const c=document.createElement("div");c.className="confetti";const cols=["#E7B85A","#2F7D5B","#B8503E","#4A90D9","#E85A8A","#D9B441"];for(let i=0;i<50;i++){const p=document.createElement("i");p.style.left=(Math.random()*100)+"%";p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*0.35)+"s";p.style.width=(6+Math.random()*6)+"px";c.appendChild(p);}document.body.appendChild(c);setTimeout(()=>c.remove(),2700);}catch(e){}}

/* ---------- платежи ---------- */
function nextMonth(iso){const d=new Date(iso);d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,10);}
function renderPayments(){const box=document.getElementById("payList");if(!box)return;const list=state.payments.slice().sort((a,b)=>(a.date+"").localeCompare(b.date+""));
  if(!list.length){box.innerHTML=`<div class="empty"><span class="em">📅</span><p>Добавьте предстоящие счета и платежи с датой и суммой — приложение покажет ближайшие и сколько дней осталось.</p><button class="btn primary" data-modal="payment">＋ Добавить платёж</button></div>`;return;}
  box.innerHTML=`<div class="mini">`+list.map(p=>{const dl=daysLeft(p.date);const over=!p.paid&&dl<0;const soon=!p.paid&&dl>=0&&dl<=5;
    const tag=p.paid?`<span class="chip ok">оплачено</span>`:over?`<span class="chip warn">просрочен</span>`:`<span class="chip ${soon?"warn":""}">${dl===0?"сегодня":dl+" дн"}</span>`;
    return `<div class="pay-row"><div class="pay-ic">${p.paid?"✅":"📅"}</div><div class="pay-body"><div class="pay-name">${esc(p.name)}</div><div class="pay-meta">${fmtDate(p.date)}${p.recurring==="monthly"?" · ежемесячно":""}</div></div><div class="pay-right"><div class="pay-amt">${money(p.amount)}</div>${tag}</div><div class="pay-actions"><button class="link-btn" data-act="pay-toggle" data-id="${p.id}">${p.paid?"вернуть":"оплатил"}</button><button class="link-btn" data-act="pay-edit" data-id="${p.id}">изменить</button><button class="link-btn" data-act="pay-del" data-id="${p.id}">удалить</button></div></div>`;
  }).join("")+`</div>`;
}
function modalPayment(id){openDetail=null;const p=id?state.payments.find(x=>x.id===id):null;
  openModal(`<h3>${p?"Изменить платёж":"Новый платёж"}</h3>
    <div class="field"><label>Название</label><input id="m_name" placeholder="Напр. Аренда" maxlength="40" value="${p?esc(p.name):""}"></div>
    <div class="field"><label>Сумма</label><input id="m_amount" inputmode="decimal" placeholder="0" value="${p?p.amount:""}"></div>
    <div class="field"><label>Дата</label><input id="m_date" type="date" value="${p?p.date:todayISO()}"></div>
    <div class="field"><label>Повтор</label><div class="seg"><label><input type="radio" name="rec" value="none" ${!p||p.recurring!=="monthly"?"checked":""}><span>Разовый</span></label><label><input type="radio" name="rec" value="monthly" ${p&&p.recurring==="monthly"?"checked":""}><span>Ежемесячно</span></label></div></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="m_ok">${p?"Сохранить":"Добавить"}</button></div>`);
  document.getElementById("m_ok").onclick=()=>{const name=document.getElementById("m_name").value.trim();const amount=parseAmt(document.getElementById("m_amount").value);const date=document.getElementById("m_date").value||todayISO();const recurring=(modalEl.querySelector('input[name="rec"]:checked')||{}).value||"none";
    if(!name)return toast("Введите название");if(!(amount>0))return toast("Введите сумму");
    if(p){p.name=name;p.amount=amount;p.date=date;p.recurring=recurring;}else{state.payments.push({id:uid(),name,amount,date,recurring,paid:false});}
    renderAll();closeModal();toast(p?"Платёж изменён":"Платёж добавлен");};
}

/* ---------- отчёт ---------- */
function renderReport(){const box=document.getElementById("reportBody");if(!box)return;
  const now=new Date();const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleDateString("ru-RU",{month:"short"})});}
  const inM=(iso,my)=>{const d=new Date(iso);return d.getFullYear()===my.y&&d.getMonth()===my.m;};
  const income=months.map(my=>{let s=0;state.jars.forEach(j=>(j.history||[]).forEach(h=>{if(h.type==="deposit"&&inM(h.date,my))s+=h.amount;}));state.goals.forEach(g=>(g.history||[]).forEach(h=>{if(inM(h.date,my))s+=h.amount;}));return s;});
  const expense=months.map(my=>{let s=0;state.expenses.forEach(e=>{if(inM(e.date,my))s+=e.amount;});return s;});
  const maxV=Math.max(1,...income,...expense);
  const bars=months.map((my,i)=>`<div class="rep-col"><div class="rep-bars"><div class="rep-bar in" style="height:${income[i]/maxV*100}%"></div><div class="rep-bar out" style="height:${expense[i]/maxV*100}%"></div></div><div class="rep-lab">${my.label}</div></div>`).join("");
  const dnow=now.getDate();const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();const spentThis=expense[expense.length-1];const forecast=dnow>0?spentThis/dnow*dim:spentThis;
  const etas=state.goals.filter(g=>g.earned<g.target&&(g.history||[]).length).map(g=>{const first=g.history[0];const days=Math.max(1,Math.ceil((Date.now()-new Date(first.date))/86400000));const rate=g.earned/days;const left=g.target-g.earned;const eta=rate>0?Math.ceil(left/rate):null;return {name:g.name,eta};}).filter(x=>x.eta);
  box.innerHTML=`<div class="chart-card"><div class="chart-title">Доходы и траты по месяцам</div><div class="rep-chart">${bars}</div><div class="rep-legend"><span><i class="in"></i>доходы</span><span><i class="out"></i>траты</span></div></div>
    <div class="chart-card"><div class="chart-title">Прогноз</div>
      <div class="rep-line"><span>Прогноз трат за месяц</span><b>${money(forecast)}</b></div>
      <div class="rep-line"><span>Уже потрачено</span><b>${money(spentThis)}</b></div>
      <div class="rep-line"><span>Доход за месяц</span><b>${money(income[income.length-1])}</b></div>
      ${etas.length?etas.map(e=>`<div class="rep-line"><span>${esc(e.name)} — до цели</span><b>~${e.eta} дн</b></div>`).join(""):`<div class="rep-line"><span>Целей в процессе нет</span><b>—</b></div>`}
    </div>`;
}

/* ---------- перевод между копилками ---------- */
function modalTransfer(fromId){openDetail=null;const from=state.jars.find(j=>j.id===fromId);if(!from)return;const others=state.jars.filter(j=>j.id!==fromId);
  if(!others.length){toast("Нужна ещё одна копилка");return;}
  const opts=others.map((j,i)=>`<label><input type="radio" name="toj" value="${j.id}" ${i===0?"checked":""}><span class="pk-inner"><span class="dist-ic"></span><span class="pk-txt"><span class="pk-name">${esc(j.name)}</span><span class="pk-sub">${placeText(j)}</span></span><span class="pk-bal">${money(j.balance)}</span></span></label>`).join("");
  openModal(`<h3>Перевод</h3><p class="msub">Из «${esc(from.name)}» · есть ${money(from.balance)}</p>
    <div class="field"><label>Сумма</label><input id="m_amount" inputmode="decimal" placeholder="0"></div>
    <div class="field"><label>Куда переложить</label><div class="pick">${opts}</div></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="m_ok">Перевести</button></div>`);
  document.getElementById("m_ok").onclick=()=>{const amount=parseAmt(document.getElementById("m_amount").value);const toId=(modalEl.querySelector('input[name="toj"]:checked')||{}).value;const to=state.jars.find(j=>j.id===toId);
    if(!(amount>0))return toast("Введите сумму");if(amount>from.balance)return toast("В копилке столько нет");if(!to)return toast("Выберите копилку");
    from.balance-=amount;from.history.push({id:uid(),type:"withdraw",amount,date:todayISO(),note:"перевод в «"+to.name+"»"});
    to.balance+=amount;to.history.push({id:uid(),type:"deposit",amount,date:todayISO(),note:"перевод из «"+from.name+"»"});
    const done=to.target>0&&to.balance>=to.target;closeModal();renderAll();if(done)celebrate();toast("Переведено");};
}

/* ---------- редактирование копилки ---------- */
function modalJarEdit(id){openDetail=null;const j=state.jars.find(x=>x.id===id);if(!j)return;const hasGoal=j.target>0;
  openModal(`<h3>Изменить копилку</h3>
    <div class="seg"><label><input type="radio" name="jmode" value="free" ${!hasGoal?"checked":""}><span>Без цели</span></label><label><input type="radio" name="jmode" value="goal" ${hasGoal?"checked":""}><span>С целью</span></label></div>
    <div class="field"><label>Название</label><input id="m_name" maxlength="40" value="${esc(j.name)}"></div>
    <div class="field" id="targetField" style="display:${hasGoal?"block":"none"}"><label>Цель (сумма)</label><input id="m_target" inputmode="decimal" value="${hasGoal?j.target:""}"></div>
    <div class="field"><label>Где хранится</label><div class="seg"><label><input type="radio" name="jplace" value="cash" ${j.place!=="bank"?"checked":""}><span>💵 Наличка</span></label><label><input type="radio" name="jplace" value="bank" ${j.place==="bank"?"checked":""}><span>🏦 Счёт</span></label></div></div>
    <div class="field"><label>В каком именно</label><input id="m_place" maxlength="40" value="${esc(j.placeName||"")}"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="m_ok">Сохранить</button></div>`);
  modalEl.querySelectorAll('input[name="jmode"]').forEach(r=>r.addEventListener("change",()=>{document.getElementById("targetField").style.display=modalEl.querySelector('input[name="jmode"]:checked').value==="goal"?"block":"none";}));
  document.getElementById("m_ok").onclick=()=>{const mode=(modalEl.querySelector('input[name="jmode"]:checked')||{}).value;const name=document.getElementById("m_name").value.trim();const place=(modalEl.querySelector('input[name="jplace"]:checked')||{}).value||"cash";const placeName=document.getElementById("m_place").value.trim();
    if(!name)return toast("Введите название");let target=0;if(mode==="goal"){target=parseAmt(document.getElementById("m_target").value);if(!(target>0))return toast("Введите сумму цели");}
    j.name=name;j.target=target;j.place=place;j.placeName=placeName;renderAll();closeModal();toast("Сохранено");};
}

/* ---------- редактирование траты ---------- */
function modalExpenseEdit(id){openDetail=null;const e=state.expenses.find(x=>x.id===id);if(!e)return;
  const cats=CATS.map(c=>`<label><input type="radio" name="cat" value="${c.id}" ${c.id===e.category?"checked":""}><span><span class="e">${c.e}</span>${c.name}</span></label>`).join("");
  openModal(`<h3>Изменить трату</h3>
    <div class="field"><label>Сумма</label><input id="m_amount" inputmode="decimal" value="${e.amount}"></div>
    <div class="field"><label>Категория</label><div class="cat-grid">${cats}</div></div>
    <div class="field"><label>Заметка</label><input id="m_note" maxlength="60" value="${esc(e.note||"")}"></div>
    <div class="field"><label>Дата и время</label><div style="display:flex;gap:8px"><input id="m_date" type="date" value="${e.date}" style="flex:1"><input id="m_time" type="time" value="${tsHM(whenTs(e))}" style="flex:none;width:118px"></div></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="m_ok">Сохранить</button></div>`);
  document.getElementById("m_ok").onclick=()=>{const amount=parseAmt(document.getElementById("m_amount").value);const category=(modalEl.querySelector('input[name="cat"]:checked')||{}).value||"other";const note=document.getElementById("m_note").value.trim();const date=document.getElementById("m_date").value||e.date;const time=(document.getElementById("m_time")||{}).value||tsHM(whenTs(e));
    if(!(amount>0))return toast("Введите сумму");e.amount=amount;e.category=category;e.note=note;e.date=date;e.ts=mkTs(date,time);renderAll();closeModal();toast("Сохранено");};
}

/* ---------- импорт CSV ---------- */
function csvParse(text){const rows=[];let i=0,field="",row=[],inq=false;text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");while(i<text.length){const c=text[i];if(inq){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inq=false;}else field+=c;}else{if(c==='"')inq=true;else if(c===','||c===';'||c==='\t'){row.push(field);field="";}else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";}else field+=c;}i++;}if(field.length||row.length){row.push(field);rows.push(row);}return rows.filter(r=>r.length&&r.some(x=>(x||"").trim()));}
function parseCsvDate(s){s=(s||"").trim();if(!s)return null;let m;if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return `${m[1]}-${m[2]}-${m[3]}`;if(m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/)){let d=m[1].padStart(2,"0"),mo=m[2].padStart(2,"0"),y=m[3];if(y.length===2)y="20"+y;return `${y}-${mo}-${d}`;}const t=Date.parse(s);if(isFinite(t))return new Date(t).toISOString().slice(0,10);return null;}
function modalImportCSV(){openDetail=null;
  openModal(`<h3>Импорт выписки (CSV)</h3><p class="msub">Загрузите CSV из банка — подтянем траты.</p>
    <div class="field"><input type="file" id="csvFile" accept=".csv,text/csv"></div>
    <div id="csvStep"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Закрыть</button></div>`);
  document.getElementById("csvFile").addEventListener("change",ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>csvMap(r.result);r.readAsText(f);});
}
function csvMap(text){let rows;try{rows=csvParse(text);}catch(e){toast("Не удалось прочитать файл");return;}if(rows.length<2){toast("Мало данных в файле");return;}const header=rows[0];const sel=(n,g)=>`<select id="${n}">${header.map((h,i)=>`<option value="${i}" ${i===g?"selected":""}>${esc(h||("Столбец "+(i+1)))}</option>`).join("")}</select>`;
  const gDate=header.findIndex(h=>/дат|date/i.test(h||""));const gAmt=header.findIndex(h=>/сумм|amount|amt|value|deb/i.test(h||""));const gDesc=header.findIndex(h=>/опис|desc|назнач|наимен|коммент|merchant|name/i.test(h||""));
  document.getElementById("csvStep").innerHTML=`<p class="msub" style="margin-top:6px">Укажите столбцы (${rows.length-1} строк):</p>
    <div class="field"><label>Дата</label>${sel("csvDate",gDate>=0?gDate:0)}</div>
    <div class="field"><label>Сумма</label>${sel("csvAmt",gAmt>=0?gAmt:1)}</div>
    <div class="field"><label>Описание</label>${sel("csvDesc",gDesc>=0?gDesc:2)}</div>
    <button class="btn primary block" id="csvGo">Импортировать траты</button>`;
  document.getElementById("csvGo").onclick=()=>{const di=+document.getElementById("csvDate").value,ai=+document.getElementById("csvAmt").value,ci=+document.getElementById("csvDesc").value;let added=0;for(let k=1;k<rows.length;k++){const r=rows[k];const raw=(r[ai]||"").replace(/\s/g,"").replace(",",".").replace(/[^\d.\-]/g,"");let amt=parseFloat(raw);if(!isFinite(amt))continue;amt=Math.abs(amt);if(amt<=0)continue;const date=parseCsvDate(r[di])||todayISO();const note=(r[ci]||"").trim().slice(0,60);state.expenses.push({id:uid(),amount:amt,category:"other",note,date,ts:mkTs(date,"12:00")});added++;}renderAll();closeModal();toast(added?`Импортировано трат: ${added}`:"Ничего не добавлено");};
}

/* ---------- график курса за период (Frankfurter) ---------- */
function drawSpark(pts){const spark=document.getElementById("convSpark");if(!spark)return;const w=300,h=44,pad=4;const min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1;const step=(w-pad*2)/(pts.length-1);const d=pts.map((v,i)=>`${(pad+i*step).toFixed(1)},${(h-pad-(v-min)/rng*(h-pad*2)).toFixed(1)}`).join(" ");const up=pts[pts.length-1]>=pts[0];spark.setAttribute("viewBox",`0 0 ${w} ${h}`);spark.innerHTML=`<polyline points="${d}" fill="none" stroke="${up?"var(--green)":"var(--brick)"}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;}
async function fetchHistory(){const fEl=document.getElementById("convFrom"),tEl=document.getElementById("convTo");const spark=document.getElementById("convSpark"),lab=document.getElementById("convSparkLab");if(!fEl||!tEl||!spark)return;const f=fEl.value,t=tEl.value;spark.innerHTML="";if(lab)lab.textContent="";if(f===t)return;
  try{const end=new Date();const start=new Date();start.setDate(start.getDate()-30);const s=start.toISOString().slice(0,10),e=end.toISOString().slice(0,10);
    const res=await fetch(`https://api.frankfurter.app/${s}..${e}?from=${f}&to=${t}`);const j=await res.json();
    if(j&&j.rates){const pts=Object.keys(j.rates).sort().map(k=>j.rates[k][t]).filter(v=>typeof v==="number");if(pts.length>1){drawSpark(pts);if(lab){const chg=(pts[pts.length-1]-pts[0])/pts[0]*100;lab.textContent=`курс за 30 дней: ${chg>=0?"+":""}${chg.toFixed(1)}%`;lab.className="conv-spark-lab "+(chg>=0?"up":"down");}return;}}
    if(lab)lab.textContent="история для этой пары недоступна";
  }catch(e){if(lab)lab.textContent="";}
}

applyTheme(); renderAll(); initConverter();
(async()=>{
  try{if("indexedDB" in window){_db=await idbOpen();const saved=await idbGet("state");if(saved){state=normalize(saved);applyTheme();renderAll();}else{idbSet("state",state);}}}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist){await navigator.storage.persist();}}catch(e){}
  cloudInit(); updateAccountUI();
  if(cloudOn){showAuthGate();firebase.auth().onAuthStateChanged(async(u)=>{if(u){user=u;updateAccountUI();hideAuthGate();await cloudLoad();}else{user=null;updateAccountUI();showAuthGate();}});}
  fetchRates(); fetchNews();
})();
</script>
